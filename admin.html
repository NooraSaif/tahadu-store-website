<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <meta name="robots" content="noindex, nofollow"> <!-- keep search engines away -->
  <title>لوحة التحكم | تهادوا</title>
</head>
<body data-page="admin">
  <header class="mini-header">
    <div class="container">
      <img src="images/logo.jpeg" alt="تهادوا">
      <strong>لوحة التحكم</strong>
    </div>
  </header>
  <div class="stripe"></div>

  <main class="container">
    <!-- Login -->
    <div class="admin-box login" id="loginBox">
      <h2>تسجيل الدخول</h2>
      <label for="pass">كلمة المرور</label>
      <input type="password" id="pass">
      <div class="row" style="justify-content:center"><button class="btn" id="loginBtn">دخول</button></div>
      <p class="msg" id="loginMsg"></p>
    </div>

    <!-- Panel (hidden until login) -->
    <div id="panel" hidden>
      <div class="admin-box">
        <h2 id="formTitle">إضافة منتج جديد</h2>
        <input type="hidden" id="pid">
        <label for="title">اسم المنتج</label><input id="title">
        <label for="price">السعر (رقم فقط)</label><input id="price" type="number" min="0" step="any">
        <label for="category">القسم</label><select id="category"></select>
        <label for="description">الوصف</label><textarea id="description"></textarea>
        <label for="images">روابط الصور (رابط في كل سطر)</label><textarea id="images" placeholder="images/photo1.jpg"></textarea>
        <div class="row">
          <button class="btn" id="saveBtn">حفظ</button>
          <button class="btn light" id="clearBtn">مسح النموذج</button>
        </div>
        <p class="msg" id="msg"></p>
      </div>

      <div class="admin-box">
        <h2>المنتجات</h2>
        <div id="list"></div>
      </div>

      <div class="admin-box">
        <h2>حفظ دائم للبيانات</h2>
        <p>التعديلات هنا تُحفظ في هذا المتصفح فقط. لتظهر للزبائن: انسخ البيانات والصقها في ملف <code>js/data.js</code> ثم ارفع الموقع من جديد.</p>
        <div class="row">
          <button class="btn" id="exportBtn">نسخ البيانات</button>
          <button class="btn light" id="resetBtn">رجوع للمنتجات الافتراضية</button>
          <button class="btn light" id="logoutBtn">تسجيل خروج</button>
        </div>
        <textarea id="exportOut" hidden style="margin-top:14px;direction:ltr;min-height:180px"></textarea>
      </div>
    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
